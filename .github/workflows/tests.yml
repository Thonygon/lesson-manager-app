name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Reject tracked private credentials
        run: python3 scripts/check_repository_secrets.py

  streamlit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: streamlit

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: streamlit/requirements.lock.txt

      - name: Install locked dependencies
        run: python -m pip install --requirement requirements.lock.txt

      - name: Compile application source
        run: python -m compileall -q app.py app_pages auth core helpers services styles

      - name: Validate migration ledger
        run: python scripts/check_migrations.py

      - name: Run unit tests
        env:
          PYTHONWARNINGS: default
        run: python -m unittest discover -s tests

      - name: Install Python API dependencies
        run: python -m pip install --requirement ../python_api/requirements.txt

      - name: Test Python inference boundary
        env:
          PYTHONPATH: ../streamlit:..
        run: python -m unittest discover -s ../python_api/tests

      - name: Test offline TFM evaluator
        run: python -m unittest discover -s ../scripts -p 'test_tfm_*.py'

  expo:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: expo

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: expo/pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check Expo application
        run: pnpm run typecheck

      - name: Lint Expo application
        run: pnpm run lint

      - name: Check AI provider, response bounds and resource quality
        run: |
          node scripts/check-ai-provider-chain.cjs
          node scripts/check-bounded-ai-request.cjs
          node scripts/check-resource-quality.cjs

      - name: Export EAS Hosting artifact
        run: pnpm run export:web
