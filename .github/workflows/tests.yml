name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock.txt

      - name: Install locked dependencies
        run: python -m pip install --requirement requirements.lock.txt

      - name: Compile application source
        run: python -m compileall -q app.py app_pages auth core helpers services styles

      - name: Validate migration ledger
        run: python scripts/check_migrations.py

      - name: Run unit tests
        env:
          PYTHONWARNINGS: default
        run: python -m unittest discover -s tests
