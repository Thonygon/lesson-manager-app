name: Public domain health

on:
  pull_request:
    paths:
      - '.github/workflows/public-domain-health.yml'
      - 'scripts/check_public_domains.py'
      - 'scripts/test_public_domains.py'
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-domains:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Check DNS, TLS, site and app routes
        run: python3 scripts/check_public_domains.py
